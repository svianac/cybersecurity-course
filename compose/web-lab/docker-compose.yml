
services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: lab-juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - host-access
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  dvwa-db:
    image: mariadb:10
    container_name: lab-dvwa-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: dvwa
      MARIADB_USER: dvwa
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - dvwa-data:/var/lib/mysql
    networks:
      - vulnerable-net
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    container_name: lab-dvwa
    depends_on:
      dvwa-db:
        condition: service_healthy
    environment:
      DB_SERVER: dvwa-db
      DB_DATABASE: dvwa
      DB_USER: dvwa
      DB_PASSWORD: p@ssw0rd
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - vulnerable-net
      - host-access
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

volumes:
  dvwa-data:

networks:
  vulnerable-net:
    driver: bridge
    internal: true

  host-access:
    driver: bridge
